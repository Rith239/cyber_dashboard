{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="display-4">403</h1>
    <p class="lead">You don't have permission to access this page.</p>
    <a href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
        Go to Dashboard
    </a>
</div>
{% endblock %}
