{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="display-4">404</h1>
    <p class="lead">That page doesn't exist.</p>
    <a href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
        Go to Dashboard
    </a>
</div>
{% endblock %}
